[project]
name = "legislacao-renovaveis"
version = "0.1.0"
requires-python = ">=3.10"

[tool.ruff]
line-length = 110
target-version = "py310"
extend-exclude = [
  ".venv",
  "data",
  "dist",
  "build",
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

[tool.ruff.lint]
select = [
  "F",   # Pyflakes (imports não usados, variáveis não usadas, etc.)
  "E",   # pycodestyle errors
  "W",   # pycodestyle warnings
  "I",   # isort (ordenação de imports)
  "UP",  # pyupgrade
  "B",   # bugbear
  "SIM", # simplificações
]
ignore = [
  "E501", # deixa o formatter tratar do comprimento de linha
]

[tool.ruff.lint.isort]
combine-as-imports = true
known-first-party = ["src"]
section-order = ["future", "standard-library", "third-party", "first-party", "local-folder"]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"] # re-exports ok
"src/**/tests/**.py" = ["S101"] # se usares asserts em testes
